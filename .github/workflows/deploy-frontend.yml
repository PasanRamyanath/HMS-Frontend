name: Frontend CI/CD & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-build:
    name: Lint, Typecheck & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Quality Gate — Biome Lint Check
        run: npx biome check .

      - name: Quality Gate — Knip Dead Code Analysis
        run: npx knip

      - name: Quality Gate — TypeScript Validation
        run: npx tsc --noEmit

      - name: Quality Gate — Vite Production Build
        run: npx vite build

  deploy-s3-cloudfront:
    name: Deploy to Amazon S3 & Invalidate CloudFront
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Vite Production Build
        run: npx vite build

      - name: Configure AWS Credentials via GitHub OIDC
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}

      - name: Sync Frontend Build to Amazon S3
        if: env.AWS_ROLE_ARN != '' && env.S3_BUCKET != ''
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html s3://${{ env.S3_BUCKET }}/index.html --cache-control "no-cache, no-store, must-revalidate"
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}

      - name: Invalidate Amazon CloudFront Cache
        if: env.AWS_ROLE_ARN != '' && env.CF_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CF_DISTRIBUTION_ID }} --paths "/*"
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          CF_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
