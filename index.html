<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Sri Lankan Hotel Management System & Contactless QR Platform" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LankaHMS" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem("hms_theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          var brandColor = localStorage.getItem("hms_brand_color") || "#0D7450";
          if (brandColor && /^#[0-9A-Fa-f]{3,8}$/.test(brandColor)) {
            var hex = brandColor.replace("#", "");
            if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
            var r = parseInt(hex.substring(0, 2), 16);
            var g = parseInt(hex.substring(2, 4), 16);
            var b = parseInt(hex.substring(4, 6), 16);
            if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
              var root = document.documentElement;
              root.style.setProperty("--brand-primary", brandColor);
              root.style.setProperty("--brand-surface", "rgba(" + r + "," + g + "," + b + ",0.08)");
              root.style.setProperty("--brand-border", "rgba(" + r + "," + g + "," + b + ",0.25)");
              root.style.setProperty("--brand-ring", "rgba(" + r + "," + g + "," + b + ",0.35)");
            }
          }
        } catch (e) {}
      })();
    </script>
    <title>Sri Lanka Cloud SaaS HMS</title>
  </head>
  <body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
